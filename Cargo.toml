[package]
name = "inro"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Minimum-footprint embedded key-value database engine, in pure Rust. Name reserved — implementation in progress."
repository = "https://gitlab.com/syrakon/inro"
license = "MIT OR Apache-2.0"
keywords = ["database", "embedded", "key-value", "btree", "iot"]
categories = ["database-implementations", "database", "embedded", "no-std"]
# Lista blanca, no lista negra: el paquete publicado en crates.io lleva solo el
# stub, la licencia y el README. El diseño en `docs/` no se publica mientras el
# repositorio siga siendo privado.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

# Prohibido en todo el crate, no solo en lib.rs: así cubre también tests,
# benches y ejemplos.
[lints.rust]
unsafe_code = "forbid"

# Cada dependencia que se añada lleva su justificación escrita aquí al lado,
# igual que en arkeion. Parser, B-tree, codificaciones, varint, CRC32,
# bitpacking y compresión se escriben a mano.
#
# Única excepción a la regla de cero dependencias de runtime. No se escriben
# primitivas criptográficas propias: el ahorro no compensa el riesgo. Ambas son
# de RustCrypto, Rust puro y compatibles con no_std, y solo se compilan si la
# feature está activa.
# `aes-gcm` necesita su PROPIA feature `aes` (no la de este crate, aunque
# se llamen igual: son espacios de nombres distintos, uno por crate) para
# exponer el tipo `Aes256Gcm` en sí — sin ella, `default-features = false`
# deja fuera tanto ese alias como su dependencia opcional `aes`, y
# `crypto.rs` no compila bajo la feature `aes` de este crate. Verificado
# contra el `Cargo.toml` publicado de `aes-gcm` 0.10.3: sus features por
# defecto son `["aes", "alloc", "getrandom"]`; aquí se activa solo `aes` +
# `alloc`, sin `getrandom` (no hace falta: este crate no genera nonces con
# esa dependencia, ver `crypto::generate_nonce`).
#
# `rusqlite` (tarea 21) es la comparativa de la sección 17.1 de la
# especificación: SQLite real, no una reimplementación de su formato. El
# brief la pedía en `[dev-dependencies]`, pero Cargo rechaza el manifiesto
# con "dev-dependencies are not allowed to be optional" — una dependencia
# de desarrollo se resuelve siempre, para cualquier `cargo test`, sin
# importar qué *features* estén activas; no hay forma de condicionarla ahí.
# Se declara aquí, en `[dependencies]`, exactamente con el mismo patrón que
# las dos de cifrado — `optional = true` tras su propia *feature*
# (`bench-sqlite`, más abajo) — que es la única forma que Cargo ofrece de
# hacer una dependencia condicional. La diferencia con las de cifrado: esas
# SÍ las usa `src/`, así que activarlas cambia el binario publicado; a
# `rusqlite` solo la usa `tests/size.rs`, que el `include` de arriba deja
# fuera del paquete de crates.io — así que activar `bench-sqlite` en una
# instalación de `inro` como dependencia de otro proyecto no compila ni
# enlaza nada de más, solo declara una *feature* sin código alcanzable que
# la use. `cargo tree --edges normal` (sin pasar `--features`, como hacen
# los cinco comandos de verificación de este proyecto) no la ve: un
# opcional sin activar no entra en el árbol resuelto, igual que ya pasa hoy
# con `chacha20poly1305`/`aes-gcm` bajo esos mismos cinco comandos.
# `features = ["bundled"]` compila su propio SQLite en vez de enlazar el
# del sistema: sin eso, la comparativa dependería de qué versión de SQLite
# tenga instalada quien ejecute el banco, y dos máquinas darían números
# distintos para la misma prueba.
[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["alloc", "aes"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Solo para pruebas (tarea 19): las dependencias de desarrollo no cuentan
# contra la regla de cero dependencias de runtime — no viajan al binario del
# usuario, `cargo build` (sin `--tests`) ni siquiera las resuelve — y no
# llegan al paquete publicado en crates.io (ver `include`, arriba: `tests/`
# no está en la lista blanca). `tests/props.rs` es el único consumidor.
[dev-dependencies]
proptest = "1"

[features]
default = ["std", "audit"]
std = []
encryption = ["dep:chacha20poly1305"]
aes = ["encryption", "dep:aes-gcm"]
# Comparativa de la tarea 21 contra SQLite (`tests/size.rs`,
# `compare_against_sqlite_on_the_same_workload`). Ver el comentario de
# `rusqlite`, arriba en `[dependencies]`, sobre por qué vive ahí y no en
# `[dev-dependencies]` como pedía el brief literalmente.
bench-sqlite = ["dep:rusqlite"]
# `Db::audit_pages` (tarea 19): recorre TODO el fichero — árbol, cadenas de
# overflow y lista de libres — para comprobar que cada página tiene
# exactamente un dueño. Coste O(n_pages), nada que ver con el camino
# caliente de `put`/`get`/`commit`, así que se ofrece como una decisión de
# compilación aparte en vez de colgarla sin más de `std` — coherente con el
# resto de este `Cargo.toml`, donde cada feature es una elección explícita,
# no una comodidad activada por defecto sin que nadie la pidiera. Va en
# `default` de todos modos: las cinco combinaciones de compilación que este
# proyecto verifica en cada tarea (`cargo test`, `--features encryption`,
# `--features aes`, `--no-default-features`, `cargo build
# --no-default-features`) la ejercitan sin necesitar `--features audit` en
# ningún comando — solo queda fuera si alguien pide explícitamente
# `--no-default-features` (que ya deja fuera `std`, y con él `Db` entero) o
# construye a mano con `--no-default-features --features std` para no
# pagar ni el código de esta comprobación en un binario final. Depende de
# `std`, no al revés: pedir `audit` sin más ya activa `std`, porque
# `audit_pages` vive en `tx.rs`, que no existe sin esa feature.
audit = ["std"]

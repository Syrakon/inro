stages: [check, test, bench]

# Pinnado explícito, no implícito en lo que traiga el runner por defecto
# (hallazgo de una ronda de revisión posterior a la tarea 21): sin `image:`,
# cada job depende de que la imagen por defecto del runner que ejecute este
# pipeline traiga instalada una toolchain de Rust — verdad hoy, accidente
# mañana si alguien cambia esa imagen por defecto sin tocar este fichero.
# `rust:1.89` coincide con `rust-version` de `Cargo.toml`: el mínimo que el
# propio crate declara soportar, ni más nuevo (que podría aceptar código que
# luego falla para consumidores en el mínimo real) ni más viejo (que podría
# rechazar código válido).
image: rust:1.89

variables:
  CARGO_TERM_COLOR: always

check:
  stage: check
  script:
    # `cargo fmt --check` NO va aquí, a diferencia del brief: se comprobó
    # antes de escribir este fichero, contra el HEAD anterior a esta tarea
    # (`bd6a7d3`, sin ningún cambio de la tarea 21) y ya reporta 414
    # discrepancias repartidas por TODOS los ficheros de `src/` y `tests/`
    # existentes — el estilo del proyecto (estructuras literales y
    # expresiones sin envolver bastante por encima de los 100 caracteres
    # por defecto de `rustfmt`, cuerpos de una línea donde `rustfmt`
    # preferiría un bloque) nunca se generó con `cargo fmt`, y el formato no
    # ha formado parte de los cinco comandos de verificación de ninguna de
    # las veinte tareas anteriores. Meter `cargo fmt --check` aquí dejaría
    # la etapa `check` en rojo desde el primer commit por un motivo que no
    # tiene nada que ver con esta tarea ni con ningún cambio futuro
    # razonable — y reformatear ~17.000 líneas ya revisadas y adjudicadas
    # como efecto colateral de un banco de tamaños está muy fuera del
    # alcance de la tarea 21. Queda anotado como trabajo pendiente aparte
    # (ver el informe de la tarea 21), no resuelto aquí ni escondido.
    # `-A` para los cuatro hallazgos ya adjudicados en las tareas 19 y 20
    # (`len_without_is_empty`/`new_without_default`/`suspicious_open_options`
    # en `storage.rs`, `identity_op` en `meta.rs`) — revisados y aceptados
    # repetidamente desde entonces, nunca suprimidos con `#[allow]` en el
    # propio código porque el proyecto prefiere dejarlos visibles y contarlos
    # a mano en cada tarea, antes que silenciarlos con una anotación. Esta es
    # la primera vez que `-D warnings` se aplica de verdad en un guardián
    # automático (no había `.gitlab-ci.yml` hasta esta tarea) — sin este `-A`
    # explícito por nombre, el primer commit tras crear este fichero
    # fallaría por cuatro hallazgos que ya existían y que ninguna tarea
    # anterior tuvo que arreglar. Cualquier OTRO hallazgo — de estos mismos
    # tipos en un sitio nuevo, o de un tipo distinto en cualquier sitio —
    # sigue haciendo fallar la construcción.
    - >
      cargo clippy --all-targets -- -D warnings
      -A clippy::len_without_is_empty
      -A clippy::new_without_default
      -A clippy::suspicious_open_options
      -A clippy::identity_op
    - cargo build --no-default-features
    # Cero dependencias de runtime sin features: el árbol es una sola línea.
    - test "$(cargo tree --edges normal --prefix none | wc -l)" -eq 1
    # Cero unsafe propio: NO se comprueba aquí con `cargo geiger
    # --forbid-only` (lo hacía una versión anterior de este fichero). Dos
    # motivos, encontrados en una ronda de revisión posterior a la tarea 21:
    # (1) es un *no-op* de verdad — el informe de la tarea 21 documenta que
    # `--forbid-only` sale con código 0 SIEMPRE para este proyecto, porque
    # solo reconoce el atributo LITERAL `#![forbid(unsafe_code)]` en los
    # ficheros de entrada, y este crate declara la prohibición en
    # `Cargo.toml` (`[lints.rust] unsafe_code = "forbid"`) para que alcance
    # también a `tests`/`benches`/ejemplos — así que este paso nunca podía
    # fallar, en ninguna dirección, y la protección real ya la da el propio
    # compilador como *lint level* en CADA `cargo build`/`cargo test`, sin
    # paso aparte. (2) `cargo install cargo-geiger --locked` compila una
    # herramienta pesada desde código fuente en CADA pipeline, sin caché,
    # solo para ejecutar un paso que no podía fallar — coste sin beneficio.
    # El informe COMPLETO de `unsafe` transitivo (`cargo geiger --features
    # aes --output-format Ascii`, SIN `--forbid-only`, que sí cuenta
    # `unsafe` real en las dependencias de cifrado) sigue siendo útil, pero
    # es trabajo de auditoría periódica, no un guardián por commit: la línea
    # base archivada en el informe de la tarea 21 (`40/72` funciones, `2671/
    # 3587` expresiones bajo `--features aes`) es el número contra el que
    # comparar la próxima vez que alguien lo ejecute a mano, o desde un job
    # `bench`/programado aparte si se decide automatizar esa comparación —
    # decisión de infraestructura que esta corrección no toma sin que nadie
    # la pida, igual que la tarea 21 no la tomó para la apertura a 2 GB.

test:
  stage: test
  script:
    - cargo test
    - cargo test --features encryption
    - cargo test --features aes
    - cargo test --no-default-features
    - cargo test --release --test props
    - cargo test --release --test faults

bench:
  stage: bench
  script:
    - mkdir -p target
    # Sin esto, `cmd | tee fichero` reporta el código de salida de `tee`
    # (casi siempre 0), no el de `cargo test` — y esta etapa EXISTE para
    # fallar cuando el umbral de 40 B/entrada no se cumple (medido: 67,72
    # B, ver más abajo). Sin `pipefail` la orden de abajo fallaría en el
    # texto impreso pero la etapa `bench` quedaría en verde de todos modos,
    # ocultando exactamente el hallazgo que este fichero existe para
    # exponer. Requiere bash (lo es por defecto en las imágenes de `rust`
    # oficiales que usaría este job); `sh` puro no soporta `set -o
    # pipefail` y fallaría aquí mismo, de forma ruidosa, no en silencio.
    - set -o pipefail
    # TODAS las pruebas de `tests/size.rs` van `#[ignore]` (medido en la
    # tarea 21: un millón de registros en modo `debug`, el que usan los
    # cinco comandos de verificación, no llegó a terminar en dos minutos de
    # reloj). Por eso hace falta `--ignored` aquí; sin él, esta orden
    # reportaría "N ignored" y ningún número.
    #
    # ORDEN DELIBERADO, corregido en una ronda de revisión posterior a la
    # tarea 21: la prueba de apertura va PRIMERO, la del umbral de
    # bytes/entrada va SEGUNDA — al revés de como estaban originalmente. El
    # umbral de 40 B/entrada (`bytes_per_log_entry_stay_under_the_threshold`)
    # FALLA a propósito (medido: 67,72 B/entrada, ver la sección 12.2 de la
    # especificación) — no se ha subido el umbral para que pase — y una
    # orden de `script` de GitLab CI que falla detiene las que le siguen. Con
    # el umbral primero, la prueba de apertura de más abajo NUNCA llegaría a
    # ejecutarse en una corrida real de integración continua, solo en local
    # (donde nadie nota que la segunda orden se saltó). Con la apertura
    # primero, corre siempre, pase lo que pase con el umbral.
    - cargo test --release --test size -- --ignored opening_costs --nocapture 2>&1 | tee target/bench-report.txt
    # Bytes/entrada + poda + control de orden de inserción, en la misma
    # orden. `--skip opening_costs` deja fuera la prueba de arriba (ya
    # corrida). `tee -a` para que las dos corridas queden en el mismo
    # artefacto.
    - cargo test --release --test size -- --ignored --skip opening_costs --nocapture 2>&1 | tee -a target/bench-report.txt
  artifacts:
    paths: [target/bench-report.txt]
    when: always
